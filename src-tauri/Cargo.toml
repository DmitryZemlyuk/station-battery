[package]
name = "station-battery"
version = "1.2.5"
description = "Tray battery monitor for EcoFlow portable power stations"
edition = "2021"
publish = false

[[bin]]
name = "station-battery"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
btleplug = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sys-locale = "0.3"
ab_glyph = "0.2"
log = "0.4"
resvg = { version = "0.50.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
