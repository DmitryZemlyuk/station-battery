name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build portable exe
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Rename
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          mkdir dist
          cp src-tauri/target/release/station-battery.exe "dist/StationBattery-${VERSION}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build universal app
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app
      - name: Zip
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          mkdir dist
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Station Battery.app" "dist/StationBattery-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
