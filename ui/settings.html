<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Station Battery</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="root">
    <!-- macOS: title + toolbar tabs live in the (transparent) title bar area -->
    <header class="mac-only mac-top" data-tauri-drag-region>
      <div id="macTitle" class="mac-title" data-tauri-drag-region></div>
      <nav class="mac-tabs" data-tauri-drag-region>
        <button class="mac-tab" data-tab="general">
          <span class="tab-ico" data-ico="tabGeneral"></span>
          <span data-t="tabGeneral"></span>
        </button>
        <button class="mac-tab" data-tab="sources">
          <span class="tab-ico" data-ico="tabSources"></span>
          <span data-t="tabSources"></span>
        </button>
        <button class="mac-tab" data-tab="notifications">
          <span class="tab-ico" data-ico="tabNotifications"></span>
          <span data-t="tabNotifications"></span>
        </button>
      </nav>
    </header>

    <main id="scroll" class="scroll">
      <h1 class="win-only page-title" data-t="pageTitle"></h1>

      <!-- General -->
      <section class="pane" data-pane="general">
        <h2 class="win-only section" data-t="tabGeneral"></h2>
        <div class="group">
          <div class="item">
            <span class="win-only ico" data-ico="station"></span>
            <div class="label"><div data-t="station"></div><div class="desc" data-t="stationHint"></div></div>
            <select id="deviceSelect"></select>
          </div>
          <div id="snRow" class="item sub hidden">
            <div class="label"><div class="desc" data-t="snHint"></div></div>
            <input id="snInput" class="text" spellcheck="false" autocomplete="off" />
          </div>
        </div>
        <div class="group">
          <div class="item">
            <span class="win-only ico" data-ico="language"></span>
            <div class="label"><div data-t="language"></div></div>
            <select id="lang">
              <option value="auto" data-t="langAuto"></option>
              <option value="uk">Українська</option>
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="item">
            <span class="win-only ico" data-ico="autostart"></span>
            <div class="label"><div><span class="win-only" data-t="autostart"></span><span class="mac-only" data-t="autostartMac"></span></div><div class="desc win-only" data-t="autostartWinHint"></div></div>
            <label class="toggle-wrap"><span class="state" data-for="autostart"></span><input id="autostart" class="toggle" type="checkbox" /></label>
          </div>
          <div class="item">
            <span class="win-only ico" data-ico="tray"></span>
            <div class="label"><div><span class="win-only" data-t="trayIcon"></span><span class="mac-only" data-t="trayIconMac"></span></div><div id="trayHint" class="desc"></div></div>
            <select id="trayStyle">
              <option value="number"></option>
              <option value="battery" data-t="trayBattery"></option>
              <option value="voltage" data-t="trayVoltage"></option>
            </select>
          </div>
        </div>
      </section>

      <!-- Sources -->
      <section class="pane" data-pane="sources">
        <h2 class="win-only section" data-t="sources"></h2>
        <div class="group">
          <div class="item">
            <span class="win-only ico" data-ico="ble"></span>
            <div class="label"><div data-t="ble"></div><div class="desc" data-t="bleHint"></div></div>
            <label class="toggle-wrap"><span class="state" data-for="bleEnabled"></span><input id="bleEnabled" class="toggle" type="checkbox" /></label>
          </div>
        </div>
        <div class="group expander">
          <div class="item">
            <span class="win-only ico" data-ico="cloud"></span>
            <div class="label"><div data-t="cloud"></div><div id="cloudDesc" class="desc"></div></div>
            <label class="toggle-wrap"><span class="state" data-for="cloudEnabled"></span><input id="cloudEnabled" class="toggle" type="checkbox" /></label>
          </div>
          <div class="cloud-sub item sub">
            <div class="label"><div data-t="email"></div></div>
            <input id="email" class="text" type="email" autocomplete="username" spellcheck="false" />
          </div>
          <div class="cloud-sub item sub">
            <div class="label"><div data-t="password"></div></div>
            <input id="password" class="text" type="password" autocomplete="current-password" />
          </div>
          <div class="cloud-sub item sub">
            <div class="label"><div data-t="region"></div></div>
            <select id="region"></select>
          </div>
          <div class="cloud-sub item sub">
            <div class="label"><div id="cloudStatus" class="desc"></div><div class="desc" data-t="signInHint"></div></div>
            <button id="signIn" class="btn accent" data-t="signIn"></button>
          </div>
        </div>
      </section>

      <!-- Notifications -->
      <section class="pane" data-pane="notifications">
        <h2 class="win-only section" data-t="notifications"></h2>
        <div class="group expander">
          <div class="item">
            <span class="win-only ico" data-ico="notifyLow"></span>
            <div class="label"><div data-t="notifyLow"></div></div>
            <label class="toggle-wrap"><span class="state" data-for="notifyLow"></span><input id="notifyLow" class="toggle" type="checkbox" /></label>
          </div>
          <div id="thresholdRow" class="item sub">
            <div class="label"><div data-t="threshold"></div></div>
            <div class="slider"><input id="lowThreshold" type="range" min="5" max="50" step="5" /><span id="thresholdVal"></span></div>
          </div>
        </div>
        <div class="group">
          <div class="item">
            <span class="win-only ico" data-ico="notifyFull"></span>
            <div class="label"><div data-t="notifyFull"></div></div>
            <label class="toggle-wrap"><span class="state" data-for="notifyFull"></span><input id="notifyFull" class="toggle" type="checkbox" /></label>
          </div>
        </div>
      </section>

      <footer class="foot row">
        <span id="version" class="desc"></span>
        <button id="quit" class="btn win-only" data-t="quit"></button>
      </footer>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
