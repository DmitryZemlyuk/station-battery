<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Station Battery</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="card" class="card">

    <!-- Windows 11: Fluent flyout -->
    <section class="win-only fly">
      <div class="fly-body">
        <div class="row">
          <span id="wModel" class="w-title"></span>
          <span id="wAgo" class="w-caption"></span>
        </div>
        <div id="wValue" class="ring-row">
          <div class="ring">
            <svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true">
              <circle cx="28" cy="28" r="24" class="ring-track" />
              <circle id="wArc" cx="28" cy="28" r="24" class="ring-arc" />
            </svg>
            <span id="wBolt" class="ring-bolt hidden" data-ico="bolt"></span>
          </div>
          <div>
            <div id="wSoc" class="w-display">–</div>
            <div id="wStatus" class="w-caption"></div>
          </div>
        </div>
        <div id="wEmpty" class="w-empty hidden">
          <div id="wEmptyTitle" class="w-subtitle"></div>
          <div id="wEmptyHint" class="w-caption"></div>
        </div>
        <div id="wTiles" class="w-tiles hidden">
          <div class="w-tile">
            <div class="w-caption"><span class="cap-ico" data-ico="in"></span><span id="wLIn"></span></div>
            <div id="wIn" class="w-tile-v"></div>
          </div>
          <div class="w-tile">
            <div class="w-caption"><span class="cap-ico" data-ico="out"></span><span id="wLOut"></span></div>
            <div id="wOut" class="w-tile-v"></div>
          </div>
        </div>
      </div>
      <div class="fly-foot row">
        <span id="wSource" class="w-caption"></span>
        <button id="wSettings" class="w-icon-btn"><span class="btn-ico" data-ico="gear"></span>
        </button>
      </div>
    </section>

    <!-- macOS: menu bar panel (Control Center style) -->
    <section class="mac-only panel">
      <div class="row m-head">
        <span id="mModel" class="m-title"></span>
        <span id="mSource" class="m-caption"></span>
      </div>
      <div id="mValue" class="m-group">
        <div class="row m-big-row">
          <span class="m-big-wrap">
            <span id="mSoc" class="m-big">–</span>
            <span id="mBolt" class="m-bolt hidden" data-ico="bolt"></span>
          </span>
          <span id="mEnergy" class="m-caption"></span>
        </div>
        <div class="m-bar"><div id="mFill" class="m-fill"></div></div>
        <div id="mStatus" class="m-caption m-status"></div>
      </div>
      <div id="mEmpty" class="m-group hidden">
        <div id="mEmptyTitle" class="m-empty-title"></div>
        <div id="mEmptyHint" class="m-caption"></div>
      </div>
      <div id="mPower" class="m-group m-rows hidden">
        <div class="row"><span id="mLIn" class="m-caption"></span><span id="mIn"></span></div>
        <div class="row"><span id="mLOut" class="m-caption"></span><span id="mOut"></span></div>
      </div>
      <div class="m-menu">
        <div class="m-sep"></div>
        <div id="mSettings" class="m-item row"><span id="mSettingsLabel"></span><span class="m-kbd">⌘,</span></div>
        <div id="mQuit" class="m-item row"><span id="mQuitLabel"></span><span class="m-kbd">⌘Q</span></div>
      </div>
    </section>
  </div>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
